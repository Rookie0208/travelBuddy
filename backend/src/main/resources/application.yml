server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: tripsplit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5434}/tripsplit}
    username: ${DB_USER:tripsplit}
    password: ${DB_PASSWORD:tripsplit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  jwt:
    # MUST be at least 32 characters. Override in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-minutes: 15
    refresh-days: 30
  mail:
    enabled: ${MAIL_ENABLED:false}     # false = print verification code in the server log (dev)
    from: ${MAIL_FROM:no-reply@tripsplit.app}
  fcm:
    # Set to true to enable FCM push notifications; false to keep disabled (logs only).
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:classpath:firebase-service-account.json}
